<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SCV 비밀번호 찾기</title>
    <link rel="stylesheet" href="../coolfile/font/css/pretendard.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/password-find.css">
</head>
<body>
    <div id="wrap">
        <header class="header">
            <h1>
                <a href="../" class="logo">
                    <img src="../coolfile/img/image 2.svg" alt="THE SCV">
                </a>
            </h1>
            <button type="button" class="menu_btn">
                <span class="sr-only">메뉴 열기</span>
            </button>
        </header>

        <main class="main">
            <section class="password_find_section">
                <h2>비밀번호 찾기</h2>

                <form action="">
                    <fieldset>
                        <legend class="sr-only">비밀번호 찾기</legend>

                        <div class="input_group">
                            <label for="user_email">가입 시 사용한 이메일<span class="required" aria-hidden="true">*</span></label>
                            <input type="email" id="user_email" name="user_email" placeholder="가입 시 사용한 이메일을 입력해 주세요.">
                        </div>

                        <p class="password_find_notice">
                            *이메일이 수신되지 않거나, 이메일주소가 기억나지 않을 경우 고객센터로 문의 주시기 바랍니다.
                        </p>

                        <button type="submit" class="email_btn">이메일 발송</button>
                    </fieldset>
                </form>
            </section>
        </main>

        <footer class="footer">
            <div class="footer_inner">
                <p class="footer_logo">
                    <img src="../coolfile/img/image 5.svg" alt="THE SCV">
                </p>

                <nav class="footer_nav" aria-label="푸터 메뉴">
                    <ul>
                        <li><a href="#">개인정보처리방침</a></li>
                        <li><a href="#">FAQ</a></li>
                        <li><a href="#">공지사항</a></li>
                        <li><a href="#">이벤트</a></li>
                    </ul>
                </nav>

                <div class="company_info">
                    <p>(주) 더에스씨브이</p>
                    <p>사업자등록번호 · 304-86-01133 | 대표자 : 김기연</p>
                    <p>직접정보제공사업자 · 서울특별시 서울특별시 2018-2호</p>
                    <p>대표전화 · 02-558-1195 | 서울특별시 강남구 영동대로 85길 20-7, 4층 4호<br>동, 우편번호)</p>
                    <p>Copyright © The SCV. All rights reserved.</p>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
