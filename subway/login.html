<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SCV 로그인</title>
    <link rel="stylesheet" href="../coolfile/font/css/pretendard.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div id="wrap">
        <header class="header">
            <h1>
                <a href="../" class="logo">
                    <img src="../coolfile/img/image 2.svg" alt="THE SCV">
                </a>
            </h1>
            <button type="button" class="menu_btn">
                <span class="sr-only">메뉴 열기</span>
            </button>
        </header>

        <main class="main">
            <section class="login_section">
                <h2>로그인</h2>

                <form action="">
                    <fieldset>
                        <legend class="sr-only">로그인</legend>

                        <div class="input_group">
                            <label for="user_id">아이디 <span class="required" aria-hidden="true">*</span></label>
                            <input type="text" id="user_id" name="user_id" placeholder="아이디를 입력해 주세요.">
                        </div>

                        <div class="input_group">
                            <label for="user_password">비밀번호 <span class="required" aria-hidden="true">*</span></label>
                            <input type="password" id="user_password" name="user_password" placeholder="비밀번호를 입력해 주세요.">
                        </div>

                        <a href="#" class="password_link">비밀번호를 잊으셨나요?</a>

                        <button type="submit" class="login_btn">로그인</button>
                        <a href="#" class="join_btn">회원가입</a>
                    </fieldset>
                </form>
            </section>
        </main>

        <footer class="footer">
            <div class="footer_inner">
                <p class="footer_logo">
                    <img src="../coolfile/img/image 2.svg" alt="THE SCV">
                </p>

                <nav class="footer_nav" aria-label="푸터 메뉴">
                    <ul>
                        <li><a href="#">개인정보처리방침</a></li>
                        <li><a href="#">FAQ</a></li>
                        <li><a href="#">공지사항</a></li>
                        <li><a href="#">이벤트</a></li>
                    </ul>
                </nav>

                <div class="company_info">
                    <p>(주) 더에스씨브이</p>
                    <p>사업자등록번호 · 304-86-01133 | 대표자 : 김기연</p>
                    <p>직접정보제공사업자 · 서울특별시 서울특별시 2018-2호</p>
                    <p>대표전화 · 02-558-1195 | 서울특별시 강남구 영동대로 85길 20-7, 4층 4호<br>동, 우편번호)</p>
                    <p>Copyright © The SCV. All rights reserved.</p>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
